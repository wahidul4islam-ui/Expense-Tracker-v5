name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app files from zip
        run: |
          unzip -q -o Expense_Tracker_App.zip -d _zip
          mkdir -p www
          if [ -d _zip/pwa ]; then cp -r _zip/pwa/. www/; else cp -r _zip/. www/; fi
          test -f www/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: |
          SM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Expense Tracker" com.wahidul.expensetracker --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert www/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/$f.png
            done
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
