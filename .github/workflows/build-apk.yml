name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Optional but important: keeps the same signing key every build,
      # so the new APK installs OVER the old app and your data stays.
      # Create secret DEBUG_KEYSTORE_BASE64 once (see README below).
      - name: Use fixed signing key
        env:
          K: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$K" ]; then
            mkdir -p ~/.android
            echo "$K" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Web files
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-*.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor-community/speech-recognition@6
          npx cap init "Expense Tracker" com.expense.tracker --web-dir www
          npx cap add android
          npx cap sync android

      - name: Permissions (mic + backup files)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' $M
          grep -n "uses-permission" $M

      - name: App icon (skipped if it fails)
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-foreground.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0e8a63' --iconBackgroundColorDark '#0b1410'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
